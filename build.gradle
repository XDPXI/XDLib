plugins {
    id "java"
}

allprojects {
    apply plugin: "java"

    group = "dev.xdpxi.realevents"
    version = project.property("version")

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    repositories {
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.neoforged.net/releases" }
    }
}
