plugins {
    id "java"
}

allprojects {
    apply plugin: "java"

    group = "dev.xdpxi"
    version = rootProject.property("version")

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
    }

    repositories {
        mavenCentral()
        maven { url = "https://maven.neoforged.net/releases" }
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
        maven { url = "https://libraries.minecraft.net" }
        maven { url = "https://repo.papermc.io/repository/maven-public/" }
    }

    dependencies {
        implementation 'org.slf4j:slf4j-api:2.0.19'
        implementation "org.yaml:snakeyaml:2.7"
    }
}

tasks.register('updateFabricVersions') {
    doLast {
        String projectVersion = project.version.toString()

        fileTree(rootDir) {
            include '**/fabric.mod.json'
        }.each { file ->
            String content = file.text

            String relativePath = file.absolutePath
            def matcher = relativePath =~ /fabric-(\d+\.\d+(?:\.\d+)?)/
            String minecraftVersion = matcher ? matcher[0][1] : "1.21"

            content = content.replaceAll(
                    /"version"\s*:\s*"[^"]*"/,
                    "\"version\": \"${projectVersion}-fabric-${minecraftVersion}\""
            )

            file.text = content
        }
    }
}

tasks.register('updateNeoForgeVersions') {
    doLast {
        String projectVersion = project.version.toString()

        fileTree(rootDir) {
            include '**/neoforge.mods.toml'
        }.each { file ->
            String relativePath = file.absolutePath
            def matcher = relativePath =~ /neoforge-(\d+\.\d+(?:\.\d+)?)/
            String minecraftVersion = matcher ? matcher[0][1] : "1.21"

            file.text = file.text.replaceAll(
                    /version\s*=\s*"[^"]*"/,
                    "version = \"${projectVersion}-neoforge-${minecraftVersion}\""
            )
        }
    }
}

tasks.register('updateBukkitVersion') {
    doLast {
        String projectVersion = project.version.toString()

        fileTree(rootDir) {
            include '**/plugin.yml'
        }.each { file ->
            file.text = file.text.replaceAll(
                    /(?m)^version\s*:\s*.*$/,
                    "version: ${projectVersion}-bukkit"
            )
        }
    }
}

tasks.register('updateBungeeVersion') {
    doLast {
        String projectVersion = project.version.toString()

        fileTree(rootDir) {
            include '**/bungee.yml'
        }.each { file ->
            file.text = file.text.replaceAll(
                    /(?m)^version\s*:\s*.*$/,
                    "version: ${projectVersion}-bungeecord"
            )
        }
    }
}

tasks.register('updateConstantsVersion') {
    doLast {
        String projectVersion = project.version.toString()

        fileTree(rootDir) {
            include '**/Constants.java'
        }.each { file ->
            file.text = file.text.replaceAll(
                    /public\s+static\s+final\s+String\s+VERSION\s*=\s*"[^"]*";/,
                    "public static final String VERSION = \"${projectVersion}\";"
            )
        }
    }
}

tasks.named('build') {
    dependsOn(
            'updateFabricVersions',
            'updateNeoForgeVersions',
            'updateBukkitVersion',
            'updateBungeeVersion',
            'updateConstantsVersion'
    )
}
