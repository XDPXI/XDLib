plugins {
    id 'multiloader-loader'
}
repositories {
    maven {
        url "https://libraries.minecraft.net"
    }
}
dependencies {
    compileOnly("net.md-5:bungeecord-api:${bungeecord_version}")
    implementation("com.google.code.gson:gson:2.13.1")
    implementation("org.slf4j:slf4j-api:2.0.17")
}