plugins {
    id 'multiloader-loader'
}
repositories {
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}
dependencies {
    compileOnly("io.papermc.paper:paper-api:${bukkit_version}")
}